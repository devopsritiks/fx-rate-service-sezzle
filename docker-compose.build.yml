# Build-from-source override. The default docker-compose.yml pulls
# pre-built images from GHCR — this file layers `build:` directives back
# on top for anyone who wants to build locally instead (e.g. you're
# actively changing the Go code). Use with:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Only `fxservice` and `fakevendor` need this — postgres/prometheus/grafana
# are always pulled from their own public images either way.
services:
  fakevendor:
    build:
      context: .
      dockerfile: cmd/fakevendor/Dockerfile
    image: fxservice-fakevendor:local

  fxservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: local
    image: fxservice:local
