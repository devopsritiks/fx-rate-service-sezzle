global:
  scrape_interval: 5s      # short, for a responsive local demo — a real
                           # fleet would typically use 15-30s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: fxservice
    static_configs:
      # "fxservice" is the compose service name, resolved via Docker's
      # internal DNS — no hardcoded container IP.
      - targets: ["fxservice:8080"]
