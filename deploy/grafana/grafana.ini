; Minimal local-demo config: anonymous viewer access so whoever opens
; Grafana (e.g. a reviewer) sees the dashboard immediately with no
; login step. Viewer role only — anonymous users cannot edit dashboards,
; change datasources, or see admin settings. This is appropriate for a
; local docker-compose demo only; a real deployment would put Grafana
; behind SSO and never enable anonymous access.
[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer

[users]
default_theme = dark

[security]
; Local demo only — real deployments must not disable this.
allow_embedding = true
